name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - simulator
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write ASC API Key
        run: echo "$ASC_KEY" > ./AuthKey.p8
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_CONTENT }}
      - run: pnpm install --no-frozen-lockfile --filter .
      - run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_APPLE_TEAM_ID: LPA2V9NMY5
          EXPO_ASC_API_KEY_ID: Q2USX46URB
          EXPO_ASC_API_KEY_ISSUER_ID: f92e2d2d-dc20-466e-a119-cb687b96bf69
          EXPO_ASC_API_KEY_PATH: ./AuthKey.p8
